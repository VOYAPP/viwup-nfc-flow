<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#071820">
  <title>ViwUp | Mantenimiento</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { background: radial-gradient(circle at 75% 10%, #123d38 0%, #071820 50%, #051117 100%); color: #f4faf8; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 550px); text-align: center; }
    .wordmark { font-size: clamp(40px, 9vw, 60px); font-weight: 800; letter-spacing: -3px; margin-bottom: 48px; }
    .wordmark span { color: #28ca8a; }
    .line { width: 48px; height: 3px; margin: 0 auto 28px; background: #28ca8a; border-radius: 99px; }
    h1 { font-size: clamp(26px, 5vw, 38px); letter-spacing: -1.3px; line-height: 1.15; margin: 0 0 20px; }
    p { margin: 0 auto; line-height: 1.7; color: #b5ccc6; max-width: 450px; font-size: 16px; }
    footer { margin-top: 58px; font-size: 12px; color: #78948c; }
  </style>
</head>
<body>
  <main>
    <div class="wordmark" aria-label="ViwUp">Viw<span>Up</span></div>
    <div class="line" aria-hidden="true"></div>
    <h1>Estamos mejorando<br>tu experiencia</h1>
    <p>ViwUp se encuentra temporalmente en mantenimiento técnico. Estamos reforzando nuestra plataforma para ofrecer un servicio más seguro y confiable.</p>
    <footer>© 2026 ViwUp · Plataforma gastronómica</footer>
  </main>
</body>
</html>
