<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Ambassador | ViwUp</title>
    <!-- Tailwind CSS y Fuentes (Igual que el sistema de reportes) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
        * { font-family: 'Inter', sans-serif; }
    </style>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="min-h-screen bg-[#F8FAFC]">

    <!-- ═══ PANTALLA DE LOGIN ═══ -->
    <div id="login-screen" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl shadow-[0_4px_24px_rgba(15,23,42,0.05)] border border-slate-100 w-full max-w-md">
            <div class="text-center mb-8">
                <img src="/img/logo.svg" alt="ViwUp" class="h-12 w-auto mx-auto mb-4" onerror="this.src='https://via.placeholder.com/100x40?text=ViwUp'" />
                <h1 class="text-2xl font-bold text-[#0F172A]">Portal Ambassador</h1>
                <p class="text-sm text-[#64748B] mt-1">Ingresa tus credenciales para acceder</p>
            </div>
            
            <form id="login-form" onsubmit="iniciarSesion(event)" class="space-y-5">
                <div>
                    <label class="block text-[13px] font-bold text-[#0F172A] mb-1.5">Correo Electrónico</label>
                    <input type="email" id="login-email" required placeholder="tu@correo.com" class="w-full appearance-none bg-[#F8FAFC] border border-slate-200 text-[#0F172A] text-sm font-medium rounded-lg px-4 py-3 focus:ring-2 focus:ring-[#3B82F6] outline-none transition-all">
                </div>
                <div>
                    <label class="block text-[13px] font-bold text-[#0F172A] mb-1.5">PIN de Seguridad</label>
                    <input type="password" id="login-pin" required maxlength="4" pattern="[0-9]{4}" inputmode="numeric" placeholder="••••" class="w-full appearance-none bg-[#F8FAFC] border border-slate-200 text-[#0F172A] text-center tracking-[0.5em] text-xl font-bold rounded-lg px-4 py-3 focus:ring-2 focus:ring-[#3B82F6] outline-none transition-all">
                </div>
                <button type="submit" class="w-full bg-[#0F172A] hover:bg-slate-800 text-white py-3.5 rounded-lg text-sm font-bold transition-colors shadow-sm mt-2">Ingresar al Panel</button>
            </form>
        </div>
    </div>

    <!-- ═══ APP PRINCIPAL (Oculta hasta el login) ═══ -->
    <div id="app-screen" style="display: none;">
        <!-- TOP NAV -->
        <nav class="bg-white w-full border-b border-slate-100 sticky top-0 z-50">
            <div class="flex items-center justify-between px-4 md:px-12 h-14 md:h-[76px]">
                <div class="flex items-center gap-4">
                    <img src="/img/logo.svg" alt="ViwUp" class="h-10 w-auto" onerror="this.src='https://via.placeholder.com/100x40?text=ViwUp'" />
                    <span class="hidden md:inline-block px-2 py-1 bg-[#F1F5F9] text-[#3B82F6] text-[11px] font-bold rounded uppercase tracking-wider">Portal Ambassador</span>
                </div>
                <div class="flex items-center gap-4">
                    <div class="flex items-center gap-2.5">
                        <div id="inicial-vendedor" class="w-8 h-8 rounded-full bg-[#0F172A] flex items-center justify-center text-white text-sm font-bold shadow-sm">A</div>
                        <span id="nombre-vendedor" class="text-[#0F172A] text-sm font-bold hidden md:block">Cargando...</span>
                    </div>
                    <!-- Botón de Cerrar Sesión -->
                    <div class="h-6 w-px bg-slate-200 mx-1"></div>
                    <button onclick="cerrarSesion()" class="text-[13px] font-bold text-slate-400 hover:text-red-500 transition-colors">Salir</button>
                </div>
            </div>
        </nav>
        
    <!-- ═══ MAIN CONTENT ═══ -->
    <main class="px-4 md:px-12 py-8 max-w-[1200px] mx-auto space-y-8">

        <!-- ── METRICS ROW ── -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-50">
                <p class="text-xs font-semibold text-[#64748B] uppercase tracking-wide mb-2">Locales Activos</p>
                <p id="locales-activos" class="text-4xl font-extrabold text-[#0F172A]">0</p>
            </div>
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-50">
                <p class="text-xs font-semibold text-[#64748B] uppercase tracking-wide mb-2">Ganancia Mensual (MRR)</p>
                <p id="mrr-total" class="text-4xl font-extrabold text-[#10B981]">$0 <span class="text-lg text-slate-400 font-medium">CLP</span></p>
            </div>
        </div>

        <!-- ── HEADER DE ACCIONES ── -->
        <div class="flex items-center justify-between border-b border-slate-200 pb-4">
            <h2 class="text-xl font-bold text-[#0F172A]">Mis Clientes</h2>
            <button id="btn-toggle-demo" onclick="toggleFormularioDemo()" class="flex items-center gap-2 bg-[#0F172A] hover:bg-slate-800 text-white px-4 py-2 rounded-lg text-sm font-semibold transition-colors shadow-sm">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                Ingresar Demo
            </button>
        </div>

        <!-- ── FORMULARIO (Oculto por defecto) ── -->
        <section id="seccion-demo" class="bg-white rounded-2xl p-6 shadow-sm border border-slate-50" style="display: none;">
            <div class="mb-5">
                <h3 class="text-lg font-bold text-[#0F172A]">Registrar Nuevo Local</h3>
                <p class="text-sm text-[#64748B]">El local se creará en estado DEMO para que puedas probar la tarjeta NFC.</p>
            </div>
            
            <form id="form-demo" onsubmit="registrarNuevaDemo(event)" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="text" id="input-nombre-local" placeholder="Nombre del Local (Ej: Café Plaza)" required class="appearance-none bg-[#F8FAFC] border border-slate-200 text-[#0F172A] text-[13px] font-medium rounded-lg px-4 py-3 focus:ring-2 focus:ring-[#3B82F6] outline-none transition-all">
                    <input type="text" id="input-telefono" placeholder="Teléfono Admin (+569...)" required class="appearance-none bg-[#F8FAFC] border border-slate-200 text-[#0F172A] text-[13px] font-medium rounded-lg px-4 py-3 focus:ring-2 focus:ring-[#3B82F6] outline-none transition-all">
                    <input type="text" id="input-slug" placeholder="URL amigable (Ej: cafe-plaza)" required class="appearance-none bg-[#F8FAFC] border border-slate-200 text-[#0F172A] text-[13px] font-medium rounded-lg px-4 py-3 focus:ring-2 focus:ring-[#3B82F6] outline-none transition-all">
                    <input type="url" id="input-google-maps" placeholder="Link de Google Maps (Requerido)" required class="appearance-none bg-[#F8FAFC] border border-slate-200 text-[#0F172A] text-[13px] font-medium rounded-lg px-4 py-3 focus:ring-2 focus:ring-[#3B82F6] outline-none transition-all">
                    <input type="url" id="input-logo" placeholder="URL del Logo (Opcional)" class="appearance-none bg-[#F8FAFC] border border-slate-200 text-[#0F172A] text-[13px] font-medium rounded-lg px-4 py-3 focus:ring-2 focus:ring-[#3B82F6] outline-none transition-all">
                    <input type="url" id="input-bg" placeholder="URL Imagen de Fondo (Opcional)" class="appearance-none bg-[#F8FAFC] border border-slate-200 text-[#0F172A] text-[13px] font-medium rounded-lg px-4 py-3 focus:ring-2 focus:ring-[#3B82F6] outline-none transition-all">
                </div>
                
                <!-- Sección de Garzones -->
                <div class="pt-4 border-t border-slate-100">
                    <div class="flex items-center justify-between mb-3">
                        <h4 class="text-sm font-bold text-[#0F172A]">Equipo de Garzones</h4>
                        <button type="button" onclick="agregarInputGarzon()" class="text-[12px] font-bold text-[#3B82F6] hover:text-blue-700">+ Agregar otro</button>
                    </div>
                    <div id="contenedor-garzones" class="grid grid-cols-1 md:grid-cols-3 gap-3">
                        <input type="text" class="input-garzon appearance-none bg-[#F8FAFC] border border-slate-200 text-[#0F172A] text-[13px] font-medium rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-[#3B82F6] outline-none transition-all" placeholder="Nombre del Garzón 1" required>
                    </div>
                </div>

                <div class="flex justify-end pt-2">
                    <button type="submit" class="bg-[#3B82F6] hover:bg-blue-600 text-white px-6 py-2.5 rounded-lg text-sm font-semibold transition-colors shadow-sm">Guardar Demo</button>
                </div>
            </form>
        </section>

        <!-- ── TABLA DE LOCALES ── -->
        <div class="bg-white rounded-2xl shadow-[0_4px_12px_rgba(15,23,42,0.03)] overflow-x-auto">
            <table class="w-full text-left border-collapse min-w-[600px]">
                <thead class="bg-[#F8FAFC] border-b border-slate-100">
                    <tr>
                        <th class="px-6 py-4 text-[11px] font-bold text-[#64748B] uppercase tracking-wider">Local</th>
                        <th class="px-6 py-4 text-[11px] font-bold text-[#64748B] uppercase tracking-wider w-32">Estado</th>
                        <th class="px-6 py-4 text-[11px] font-bold text-[#64748B] uppercase tracking-wider text-right w-48">Acción</th>
                    </tr>
                </thead>
                <tbody id="tabla-locales" class="divide-y divide-slate-50">
                    <!-- Los datos se inyectarán aquí -->
                </tbody>
            </table>
        </div>
    </main>

    <script src="ambassador.js"></script>
</body>
</html>
