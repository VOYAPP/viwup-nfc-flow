<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><title>ViwUp | Recuperar contraseña</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f1f5f9;color:#0f172a;font:15px system-ui,sans-serif;padding:18px}
main{background:white;padding:32px;border-radius:18px;width:min(440px,100%);box-shadow:0 15px 45px #0f172a12}
h1{margin-top:0}p{color:#64748b;line-height:1.5}label{display:block;font-weight:650;margin:18px 0 7px}
input{display:block;width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:12px;font-size:16px}
button{width:100%;background:#0d9488;color:white;padding:12px;border:0;border-radius:10px;font-weight:700;margin-top:20px;cursor:pointer}
button:disabled{opacity:.6}section[hidden]{display:none}#message{margin-top:16px;color:#164e63;min-height:24px}a{color:#0d9488}
</style></head><body><main><h1>ViwUp</h1><p>Recuperar contraseña del administrador</p>
<section id="request">
<form id="requestForm"><label for="email">Correo electrónico</label><input type="email" id="email" required autocomplete="email">
<button id="requestBtn">Enviar enlace de recuperación</button></form></section>
<section id="change" hidden><form id="changeForm">
<label for="pwd">Contraseña nueva (mínimo 12 caracteres)</label><input type="password" id="pwd" minlength="12" required autocomplete="new-password">
<label for="again">Repetir contraseña</label><input type="password" id="again" minlength="12" required autocomplete="new-password">
<button id="changeBtn">Cambiar contraseña</button></form></section>
<p id="message" role="status" aria-live="polite"></p><p><a href="./admin.html">Volver a Admin</a></p>
</main><script>
const SUPABASE_URL = "https://syoypjljkwmwlrpuwxwh.supabase.co";
const PUBLISHABLE_KEY = "sb_publishable_dZPm-Pvy_CybZjW4J-j1xA_7OCqk9ZN"; // Solo clave publica, nunca Secret Key.
const $ = id => document.getElementById(id);
const msg = text => $('message').textContent = text;
const isConfigured = PUBLISHABLE_KEY.startsWith('sb_publishable_');
let recoveryVerified = false;
if(!isConfigured) {
  $('requestBtn').disabled = true;
  msg('Falta configurar la Publishable Key en este archivo.');
} else {
  const auth = window.supabase.createClient(
    SUPABASE_URL, PUBLISHABLE_KEY,
    {auth: {detectSessionInUrl: true, persistSession: true, autoRefreshToken: true}}
  );
  const showChange = () => {
    recoveryVerified = true;
    $('request').hidden = true;
    $('change').hidden = false;
    msg('Enlace verificado. Escribe tu nueva contraseña.');
  };
  auth.auth.onAuthStateChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY' && session) showChange();
  });

  // La plantilla de correo usa:
  // {{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=recovery
  // La verificación del token tiene que ocurrir antes de mostrar el formulario.
  (async () => {
    const params = new URLSearchParams(location.search);
    const tokenHash = params.get('token_hash');
    const type = params.get('type');
    if (tokenHash) {
      if (type !== 'recovery') {
        msg('El enlace no corresponde a recuperación de contraseña.');
        return;
      }
      const {data, error} = await auth.auth.verifyOtp({
        token_hash: tokenHash,
        type: 'recovery'
      });
      // No dejar el token en la barra de direcciones.
      history.replaceState(null, '', location.pathname);
      if (error || !data.session) {
        msg('El enlace venció o ya se utilizó. Solicita uno nuevo.');
        return;
      }
      showChange();
      return;
    }
    // Compatibilidad con correos estándar de Supabase (.ConfirmationURL)
    // que redirigen con type=recovery en el fragmento de la URL.
    const fragment = new URLSearchParams(location.hash.slice(1));
    if (fragment.get('type') === 'recovery') {
      const {data, error} = await auth.auth.getSession();
      if (!error && data.session) {
        history.replaceState(null, '', location.pathname);
        showChange();
        return;
      }
      msg('No se pudo validar el enlace. Solicita uno nuevo.');
    }
  })();

  $('requestForm').addEventListener('submit', async e => {
    e.preventDefault();
    $('requestBtn').disabled = true;
    const redirectTo = new URL('./recuperar-admin.html', location.href).href;
    try {
      const {error} = await auth.auth.resetPasswordForEmail(
        $('email').value.trim(), {redirectTo}
      );
      if (error) throw error;
      msg('Solicitud aceptada. Revisa tu correo (y Spam). Usa el enlace más reciente.');
    } catch(error) {
      msg(error?.status === 429
        ? 'Límite de envío de correos alcanzado. No repitas la solicitud todavía.'
        : 'Error solicitando recuperación: ' + (error?.message || 'desconocido'));
    } finally {
      $('requestBtn').disabled = false;
    }
  });
  $('changeForm').addEventListener('submit', async e => {
    e.preventDefault();
    if (!recoveryVerified) return msg('Primero abre un enlace de recuperación válido.');
    const password = $('pwd').value;
    if (password.length < 12 || password !== $('again').value) {
      return msg('Ambas contraseñas deben coincidir y tener al menos 12 caracteres.');
    }
    $('changeBtn').disabled = true;
    try {
      const {error} = await auth.auth.updateUser({password});
      if (error) throw error;
      $('pwd').value = '';
      $('again').value = '';
      await auth.auth.signOut();
      history.replaceState(null, '', location.pathname);
      recoveryVerified = false;
      $('change').hidden = true;
      $('request').hidden = false;
      msg('Contraseña actualizada en Supabase. Ya puedes volver al panel Admin.');
    } catch(error) {
      msg('No se pudo actualizar la contraseña: ' + (error?.message || 'desconocido'));
    } finally {
      $('changeBtn').disabled = false;
    }
  });
}
</script></body></html>
