<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><title>ViwUp | Recuperar contraseña</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f1f5f9;color:#0f172a;font:15px system-ui,sans-serif;padding:18px}
main{background:white;padding:32px;border-radius:18px;width:min(440px,100%);box-shadow:0 15px 45px #0f172a12}
h1{margin-top:0}p{color:#64748b;line-height:1.5}label{display:block;font-weight:650;margin:18px 0 7px}
input{display:block;width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:12px;font-size:16px}
button{width:100%;background:#0d9488;color:white;padding:12px;border:0;border-radius:10px;font-weight:700;margin-top:20px;cursor:pointer}
button:disabled{opacity:.6}section[hidden]{display:none}#message{margin-top:16px;color:#164e63;min-height:24px}a{color:#0d9488}
</style></head><body><main><h1>ViwUp</h1><p>Recuperar contraseña del administrador</p>
<section id="request">
<form id="requestForm"><label for="email">Correo electrónico</label><input type="email" id="email" required autocomplete="email">
<button id="requestBtn">Enviar enlace de recuperación</button></form></section>
<section id="change" hidden><form id="changeForm">
<label for="pwd">Contraseña nueva (mínimo 12 caracteres)</label><input type="password" id="pwd" minlength="12" required autocomplete="new-password">
<label for="again">Repetir contraseña</label><input type="password" id="again" minlength="12" required autocomplete="new-password">
<button id="changeBtn">Cambiar contraseña</button></form></section>
<p id="message" role="status" aria-live="polite"></p><p><a href="./admin.html">Volver a Admin</a></p>
</main><script>
const SUPABASE_URL = "https://syoypjljkwmwlrpuwxwh.supabase.co";
const PUBLISHABLE_KEY = "REEMPLAZAR_CON_SB_PUBLISHABLE_KEY"; // Solo clave publica, nunca Secret Key.
const $ = id => document.getElementById(id);
const msg = text => $('message').textContent = text;
const isConfigured = PUBLISHABLE_KEY.startsWith('sb_publishable_');
let recoveryVerified = false;
if(!isConfigured) {
  $('requestBtn').disabled = true;
  msg('Falta configurar la Publishable Key en este archivo.');
} else {
  const auth = window.supabase.createClient(SUPABASE_URL,PUBLISHABLE_KEY,{auth:{detectSessionInUrl:true}});
  const showChange = () => {recoveryVerified=true;$('request').hidden=true;$('change').hidden=false;msg('Enlace validado. Puedes crear una contraseña nueva.');};
  auth.auth.onAuthStateChange((event,session) => {
    if(event==='PASSWORD_RECOVERY' && session) showChange();
  });
  // Para redirecciones PKCE u otros enlaces autenticados que redirijan con ?code,
  // esperar a que supabase-js procese el código antes de habilitar el formulario.
  if(new URLSearchParams(location.search).has('code') || new URLSearchParams(location.hash.slice(1)).get('type')==='recovery') {
    setTimeout(async () => {
      const {data,error}=await auth.auth.getSession();
      if(!error && data.session) showChange();
      else if(!recoveryVerified) msg('No se pudo validar el enlace. Solicita uno nuevo.');
    },1000);
  }
  $('requestForm').addEventListener('submit',async e=>{
    e.preventDefault(); $('requestBtn').disabled=true;
    const {error}=await auth.auth.resetPasswordForEmail($('email').value.trim(),{
      redirectTo: new URL('./recuperar-admin.html',location.href).href
    });
    msg(error ? (error.status===429 ? 'Límite de correos alcanzado. No repitas la solicitud por ahora.' : error.message)
      : 'Solicitud aceptada. Si corresponde, recibirás un enlace en tu correo; revisa Spam.');
    $('requestBtn').disabled=false;
  });
  $('changeForm').addEventListener('submit',async e=>{
    e.preventDefault();
    if(!recoveryVerified) return msg('Primero abre un enlace de recuperación válido.');
    const password=$('pwd').value;
    if(password.length<12 || password!==$('again').value) return msg('Las contraseñas deben coincidir y tener al menos 12 caracteres.');
    $('changeBtn').disabled=true;
    const {error}=await auth.auth.updateUser({password});
    if(error) {msg(error.message);$('changeBtn').disabled=false;return;}
    $('pwd').value='';$('again').value='';
    await auth.auth.signOut();
    history.replaceState({},'',location.pathname);
    $('change').hidden=true; $('request').hidden=false;recoveryVerified=false;
    msg('Contraseña actualizada. Ya puedes iniciar sesión en Admin.');
    $('changeBtn').disabled=false;
  });
}
</script></body></html>
