<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto — ViwUp</title>
  <link rel="stylesheet" href="/landing.css">
</head>
<body>
  <nav class="navbar">
    <a href="/" class="navbar-logo">
  <img src="/img/logo.svg" alt="ViwUp" style="height: 64px; width: auto; display: block;">
    <div class="nav-right">
      <ul class="nav-links">
        <li><a href="/">Inicio</a></li>
        <li><a href="/como-funciona">Cómo Funciona</a></li>
        <li><a href="/contacto">Contacto</a></li>
      </ul>
      <a href="/precios" class="btn-primary">Empezar Ahora</a>
    </div>
  </nav>
  <section class="section">
    <div class="contacto-inner">
      <div class="contacto-header"><h2>Hablemos</h2><p>Déjanos tus datos y te mostraremos cómo multiplicar tus reseñas positivas en menos de una semana.</p></div>
      <form class="form-group" onsubmit="event.preventDefault()">
        <div class="input-field"><label for="nombre-local">Nombre del local</label><input type="text" id="nombre-local" placeholder="Ej. Pizzería San Telmo"></div>
        <div class="input-field"><label for="nombre-admin">Nombre del Administrador/Dueño</label><input type="text" id="nombre-admin" placeholder="Ej. Carlos Silva"></div>
        <div class="input-field"><label for="whatsapp">WhatsApp</label><input type="tel" id="whatsapp" placeholder="Ej. +56 9 1234 5678"></div>
        <button type="submit" class="btn-dark">Solicitar más información</button>
      </form>
    </div>
  </section>
  <footer class="footer"><div class="footer-bottom"><span>© 2026 ViwUp. Todos los derechos reservados.</span><span>Creado de forma segura para la gastronomía moderna.</span></div></footer>
</body>
</html>
